name: Bug report
description: Something in Firewall does not work, looks wrong or crashes.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. One problem per report, please.
        Issues here are public. Your activity log shows which sites you visit, so crop screenshots and leave out anything private.
  - type: input
    id: version
    attributes:
      label: App version
      description: Firewall, Settings, at the bottom.
      placeholder: "1.23"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model
      placeholder: Pixel 8
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "15"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Which part of the app?"
      options:
        - Apps tab, Bypass, Filtered or Blocked
        - an app's own page
        - Activity or the log
        - Domains, my own rules
        - Trackers or tracker lists
        - DNS over HTTPS
        - Private DNS warning
        - new app or tracker company alerts
        - daily mobile data cap
        - App Lock
        - backup and restore
        - weekly summary
        - Quick Settings tile or widget
        - turning on, the VPN or after a reboot
        - buying or restoring Pro
        - settings
        - other
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: The app or domain involved
      description: Which app misbehaves and, from Activity, the name it looked up. Leave empty if none.
      placeholder: "com.example.app, api.example.com"
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, one step per line.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot
      description: Only if it holds nothing private.
